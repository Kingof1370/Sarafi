name: Velyxora CI/CD Enterprise Core Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    name: Backend Lint, Build and Unit Testing
    runs-on: ubuntu-latest
    steps:
    - name: Check out standard repository
      uses: actions/checkout@v4

    - name: Install Go environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Run Package and App Tests
      run: |
        go test -v ./...

  frontend-test:
    name: Frontend Build and Static Verification
    runs-on: ubuntu-latest
    steps:
    - name: Check out standard repository
      uses: actions/checkout@v4

    - name: Install Node environment
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: apps/frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd apps/frontend
        npm ci

    - name: Build Next.js Production Target
      run: |
        cd apps/frontend
        npm run build
