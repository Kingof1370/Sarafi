apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: velyxora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: velyxora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: frontend
        image: velyxora/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: velyxora-config
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://api-gateway:8080/api/v1"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: velyxora
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: frontend
  type: ClusterIP
