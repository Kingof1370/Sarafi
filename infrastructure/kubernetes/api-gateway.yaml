apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway-sa
  namespace: velyxora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: velyxora
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: api-gateway
        image: velyxora/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: velyxora-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: JWT_SECRET
        - name: API_KEY_MASTER_SECRET
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: API_KEY_MASTER_SECRET
        - name: BACKUP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: BACKUP_ENCRYPTION_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: DB_PASSWORD
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 10
          failureThreshold: 2
        resources:
          limits:
            cpu: "1"
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: velyxora
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: api-gateway
  type: ClusterIP
