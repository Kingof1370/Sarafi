apiVersion: v1
kind: ServiceAccount
metadata:
  name: matching-engine-sa
  namespace: velyxora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: velyxora
spec:
  replicas: 1 # Matching Engine single-writer rule: strictly 1 replica for deterministic sequencing
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      serviceAccountName: matching-engine-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: matching-engine
        image: velyxora/matching-engine:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: velyxora-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: JWT_SECRET
        - name: API_KEY_MASTER_SECRET
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: API_KEY_MASTER_SECRET
        - name: BACKUP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: BACKUP_ENCRYPTION_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: DB_PASSWORD
        resources:
          limits:
            cpu: "2"
            memory: 2048Mi
          requests:
            cpu: "1"
            memory: 1024Mi
