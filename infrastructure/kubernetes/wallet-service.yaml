apiVersion: v1
kind: ServiceAccount
metadata:
  name: wallet-service-sa
  namespace: velyxora
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: velyxora
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      serviceAccountName: wallet-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: wallet-service
        image: velyxora/wallet-service:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: velyxora-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: JWT_SECRET
        - name: API_KEY_MASTER_SECRET
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: API_KEY_MASTER_SECRET
        - name: BACKUP_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: BACKUP_ENCRYPTION_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: velyxora-secrets
              key: DB_PASSWORD
        resources:
          limits:
            cpu: "1"
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 512Mi
